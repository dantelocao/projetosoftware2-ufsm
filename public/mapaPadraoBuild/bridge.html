<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Bridge</title>
</head>

<body style="background: #111; color: white; font-family: sans-serif;">
  <h2>Sincronizando dados...</h2>
  <p>Aguarde, estamos preparando a visualização 3D.</p>

  <script>
    console.log("Bridge carregado. Aguardando mensagem...");

    const ORIGINS_PERMITIDAS = [
      "https://projetosoftware2.vercel.app",
      "https://projetosoftware2-ufsm.vercel.app"
    ];

    window.addEventListener("message", (event) => {
      console.log("Mensagem recebida:", event.data, " | origem:", event.origin);

      // ❌ Se origem não for aceita → não processa
      if (!ORIGINS_PERMITIDAS.includes(event.origin)) {
        console.warn("Origem não permitida:", event.origin);
        return;
      }

      // ❌ Ignora mensagens que não sejam do tipo certo
      if (!event.data || event.data.type !== "SET_SELECTED_ARTWORKS") {
        console.warn("Mensagem ignorada", event.data);
        return;
      }

      // ✅ Pegamos os dados enviados
      const artworks = event.data.payload;

      // ✅ Salvamos no localStorage do DEPLOY 2
      localStorage.setItem("selectedArtworks", artworks);
      console.log("selectedArtworks salvo com sucesso!");

      // ⏳ Aguarda 100 ms para garantir escrita no localStorage
      setTimeout(() => {
        // ✅ Redirecionar para a Unity
        window.location.href = "/";
      }, 100);
    });
  </script>
</body>

</html>
